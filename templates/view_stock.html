{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Check Stock Level</h2>
    <form method="POST" class="mb-4">
        <div class="form-group">
            <input type="text" class="form-control" name="product_name" 
                   placeholder="Enter product name" required>
        </div>
        <button type="submit" class="btn btn-primary">Check Stock</button>
        <a href="{{ url_for('inventory_menu') }}" class="btn btn-secondary">Back</a>
    </form>

    {% if stock_level is not none %}
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Stock Level for {{ product_name }}</h5>
            <p class="card-text display-4">{{ stock_level }} units</p>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
