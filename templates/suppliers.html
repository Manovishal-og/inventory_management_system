{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Suppliers List</h2>
<table class="table table-striped">
    <thead class="thead-dark">
        <tr>
            <th>Supplier ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
        </tr>
    </thead>
    <tbody>
        {% for supplier in suppliers %}
        <tr>
            <td>{{ supplier.supplier_id }}</td>
            <td>{{ supplier.name }}</td>
            <td>{{ supplier.email }}</td>
            <td>{{ supplier.phone }}</td>
            <td>{{ supplier.address }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{{ url_for('inventory_menu') }}" class="btn btn-secondary">Back</a>
{% endblock %}
