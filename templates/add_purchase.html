{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Add New Purchase</h2>
<form method="POST">
    <div class="form-group">
        <label for="purchase_id">Purchase ID</label>
        <input type="number" class="form-control" id="purchase_id" name="purchase_id" required>
    </div>
    <div class="form-group">
        <label for="product_id">Product ID</label>
        <input type="number" class="form-control" id="product_id" name="product_id" required>
    </div>
    <div class="form-group">
        <label for="product_name">Product Name (for new product)</label>
        <input type="text" class="form-control" id="product_name" name="product_name">
    </div>
    <div class="form-group">
        <label for="category">Category (optional)</label>
        <input type="text" class="form-control" id="category" name="category">
    </div>
    <div class="form-group">
        <label for="supplier_id">Supplier ID</label>
        <input type="number" class="form-control" id="supplier_id" name="supplier_id" required>
    </div>
    <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" class="form-control" id="quantity" name="quantity" required>
    </div>
    <div class="form-group">
        <label for="price">Price Per Unit</label>
        <input type="number" step="0.01" class="form-control" id="price" name="price" required>
    </div>
    <div class="form-group">
        <label for="date">Purchase Date</label>
        <input type="date" class="form-control" id="date" name="date" required>
    </div>
    <button type="submit" class="btn btn-success">Add Purchase</button>
    <a href="{{ url_for('inventory_menu') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
